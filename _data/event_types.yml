- description: |-
    The AI in the Public Interest group brings together researchers from across Columbia
    University working to advance AI and computational methods in service of the public
    interest. Our members span a range of technical areas while sharing a common commitment
    to rigorous methodological research with clear societal relevance.

    The group provides a forum for researchers to exchange ideas across subfields, identify
    common methodological challenges, and explore how advances in AI can contribute to
    consequential real-world problems. Through seminars, collaborations, and regular
    convenings, we aim to catalyze new research partnerships, connect methodological
    innovation with substantive applications, and build a broader technical community focused
    on ensuring that advances in AI generate benefits that are widely shared across society.

    The series is led by Lily Xu and co-organized with Columbia Data Science Institute's
    Center for Data, Media, and Society.

    **The series meets every other Thursday, 3–4PM, in CSB 453 (the CS Conference Room,
    in the Mudd building).**
  label: AI in the Public Interest
  logo: "/files/images/series/ai-in-the-public-interest.png"
