- content: Realtor.com covered our MortarBench research on AI mortgage origination
    agents. Top models got nearly 1 in 4 answers wrong under realistic conditions
    — and showed systematic bias, flagging non-English names as "foreign origin" at
    5× the rate of English names. Matthew Toles and Zhou Yu are quoted in the piece.
  date: '2026-08-13'
  featured: true
  title: MortarBench featured in [Realtor.com](https://www.realtor.com/news/trends/top-ai-mortgage-underwriting-test-failure-new-report/)
- content: 'Haonan Wang has been awarded the inaugural Workday AI PhD Fellowship to
    pursue his work on Data Lake Agents. The core question: how do you teach an enterprise
    agent to gather sufficient, traceable evidence from an organization''s heterogeneous
    data sources and correctly execute the resulting workflow — while satisfying regulatory
    requirements, organizational policies, role-based permissions, approval hierarchies,
    fairness constraints, and operational budgets?'
  date: '2026-08-12'
  featured: true
  title: Haonan Wang receives inaugural Workday AI PhD Fellowship
