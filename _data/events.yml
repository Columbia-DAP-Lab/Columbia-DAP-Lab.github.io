  description: In this talk, we'll outline why a new class of agent-native infrastructure
    is emerging, what problems it is designed to solve, and the core use cases driving
    it, from autonomous coding agents to large-scale evaluation and training workloads.
    Daytona is an agent-native control plane designed to orchestrate isolated, stateful
    sandbox environments at scale. We'll break down the infrastructure challenges
