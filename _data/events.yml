- date: '2026-03-31'
  description: |-
    Autonomous agents promise substantial benefits through speed, scale, and labor savings, but
    their failures can impose abrupt and irreversible costs. The central challenge for agentic
    automation is therefore to increase the benefits of automation while bounding the consequences
    of failure. While databases remain central to modern computing, agents operate across a broader
    data environment spanning files, APIs, applications, and system state. I will outline some very
    early work towards Agentic Data Environments — the environment that agents run within — that
    serve to increase the benefits of automation while bounding their risks. We see data systems
    as shifting from passive stores of state to active execution substrates that provide safety.
  tag: Seminar
  time: 12PM
  title: Early Thoughts on Agentic Data Environments
  where: CSB 453
  who: Eugene Wu
- date: '2026-03-24'
  description: |-
    Financial customer data, including transactions, payments, digital interactions, etc,
    is inherently sequential, sparse, irregular, and challenging to model at scale.
    This talk presents a few recent developments in modeling and analyzing such complex event streams.
    First, we discuss tokenization strategies for efficiently encoding heterogeneous event features.
    Next, we show how synthetic task instruction prompts can enable robust, self-supervised
    multi-task learning directly from unlabeled data. Finally, we outline a method for diagnosing
    model blind spots through LLM-driven explanations. Together, these approaches highlight
    our ongoing progress in enabling scalable, flexible, and interpretable modeling of
    complex financial behaviors.
