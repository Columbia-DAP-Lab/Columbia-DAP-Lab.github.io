- bio: Junda Chen is a third-year Ph.D. student in Computer Science at the  University
    of California, San Diego. His research focuses on large-scale  LLM systems, with
    an emphasis on efficient inference and training of large  language models. He
    is an author of DistServe, a disaggregated inference  system adopted by major
    industry partners (including NVIDIA Dynamo, llm-d, etc.).  His broader work spans
    GPU scheduling, distributed inference frameworks, and  the design of next-generation
    serving systems for foundation models.
  date: '2025-10-14'
  description: 'Large language model (LLM) serving faces a fundamental challenge:
    the prefill  phase is compute-bound while the decode phase is memory-bound. Existing
    serving  systems co-locate these two phases and batch their computation across
    users  and requests, a strategy that not only introduces strong prefill–decode  interference
    but also couples resource allocation and parallelism choices across both phases.
    We introduce DistServe, a low-latency serving engine that assigns prefill and  decode
    computation to different GPUs, thereby eliminating interference between  the two.
    DistServe co-optimizes resource allocation and parallelism strategies  tailored
    for each phase, while placing them across the cluster to account for  bandwidth
    constraints and minimize the communication overhead introduced by  disaggregation.
    As a result, DistServe substantially improves serving performance,  measured as
    the maximum request rate that can be sustained under strict time-to-first-token
    (TTFT)  and time-per-output-token (TPOT) constraints. Since DistServe, disaggregation
    has moved into the spotlight of LLM inference,  with many companies and open-source
    projects adopting or extending this paradigm in practice.  We will also highlight
    related academic and open-source work that has emerged around  disaggregated inference,
    and reflect on the open challenges faced today as well  as the opportunities that
    lie ahead.'
  tag: Seminar
  time: 12PM
  title: 'Disaggregated LLM Inference: Past, Present, and Future'
  where: CSB 453
  who: Junda Chen
  wholink: https://gindachen.github.io/
- bio: Tianyin Xu is an Associate Professor of Computer Science at the University  of
    Illinois Urbana-Champaign (UIUC). His research focuses on building reliable  computer
    systems that empower next-generation computing. He has been on the  UIUC List
    of Teachers Ranked as Excellent for nine times. His work received  two OSDI Jay
    Lepreau Best Paper Awards, two ASPLOS Best Paper Awards, two  SIGSOFT Distinguished
    Paper Awards, a Gilles Muller Best Artifact Award, a  CACM Research Highlight,
    and an ICML Spotlight. He is also a recipient of  the C.W. Gear Outstanding Junior
    Faculty Award, a Dean's Award for Excellence  in Research, an Intel Rising Star
    Faculty Award, and a Facebook Distributed  Systems Research Award.
  date: '2025-10-07'
  description: The brains of computing systems today have increasingly been realized
    by  generative AI such as Large Language Models (LLMs) together with agentic  technologies.
    While the AI approaches are arguably more creative and cheaper  to develop, their
    safety becomes a fundamental challenge. Instead of using  another LLM as a judge
    or waiting for a provably trustworthy model to exist,  we may want to figure out
    how to build seatbelts and airbags for computing  systems driven by LLMs/agents.
    In this talk, I will share our preliminary  experience of developing a site reliability
    engineering (SRE) agent which  attempts to autonomously mitigate production system
    failures. I would also  discuss the potential of advanced system intelligence
    – AI that can  understand "systems" beyond code and reason about their safety
    properties.
  tag: Seminar
  time: 12:30PM
  title: Keep Computing Systems Safe under Disruptive Agents
