  date: '2026-02-17'
  description: 'Most enterprises do not trust agents to operate on production data
    lakes: as a result, data engineering is lagging behind the general programming
    population in leveraging coding assistants and AI tools. We argue that the popular
    strategy of trading generality for perceived trust is misguided: the agentic lakehouse
    should happen without having to assume trust and global coordination at all. We
    operationalize our agenda by re-interpreting in the OLAP world three insights
    from the MVCC literature: process isolation, data versioning, declarative APIs.
    Taken together, they allow a swarm of agents to perform safe and concurrent work
    on production data. Going from theory to practice, we describe the core implementation
    choices behind Bauplan - from git-for-data to transactional pipelines and SDK
    design -, and share lessons learned and open problems from running data workloads
    at scale.'
