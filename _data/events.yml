- bio: Kyunghyun Cho is a professor of computer science and data science at New York
    University and an executive director of frontier research at the Prescient Design
    team within Genentech Research & Early Development (gRED). He became the Glen
    de Vries Professor of Health Statistics in 2025. He is also a CIFAR Fellow of
    Learning in Machines & Brains and an Associate Member of the National Academy
    of Engineering of Korea. He served as a (co-)Program Chair of ICLR 2020, NeurIPS
    2022 and ICML 2022. He was one of the three founding Editors-in-Chief of the Transactions
    on Machine Learning Research (TMLR) until 2024. He was a research scientist at
    Facebook AI Research from June 2017 to May 2020 and a postdoctoral fellow at University
    of Montreal until Summer 2015 under the supervision of Prof. Yoshua Bengio, after
    receiving MSc and PhD degrees from Aalto University April 2011 and April 2014,
    respectively, under the supervision of Prof. Juha Karhunen, Dr. Tapani Raiko and
    Dr. Alexander Ilin. He received the Samsung Ho-Am Prize in Engineering in 2021.
    He tries his best to find a balance among machine learning, natural language processing,
    and life, but almost always fails to do so.
  date: '2025-09-30'
  description: Despite its amazing success, leaderboard chasing has become something
    researchers dread and mock. When implemented properly and executed faithfully,
    leaderboard chasing can lead to both faster and easily reproducible progress in
    science, as evident from the amazing progress we have seen with machine learning,
    or more broadly artificial intelligence, in recent decades. It does not however
    mean that it is easy to implement and execute leaderboard chasing properly. In
    this talk, I will go over four case studies demonstrating the issues that ultimately
    prevent leaderboard chasing from a valid scientific approach. The first case study
    is on the lack of proper hyperparameter tuning in continual learning, the second
    on the lack of consensus on evaluation metrics in machine unlearning, the third
    on the challenges of properly evaluating the evaluation metrics in free-form text
    generation, and the final one on wishful thinking. By going over these cases,
    I hope we can collectively acknowledge some of our own fallacies, think of underlying
    causes behind these fallacies and come up with better ways to approach artificial
    intelligence research.
  tag: Seminar
  time: 12PM
  title: Reality Checks
  where: CSB 453
  who: Kyunghyun Cho
  wholink: https://kyunghyuncho.me/
- bio: Tom Effland is the technical founder and CTO of Noetica AI, a fast-growing
    VC-backed Series A startup. The company's AI-powered knowledge platform helps
    many top law firms improve outcomes in valuable corporate debt, securities, and
    M&A transactions. Before founding Noetica, Tom earned his PhD in Computer Science
    from Columbia University. He was advised by Prof. Michael Collins and received
    support from a NSF Graduate Research Fellowship.
  date: '2025-09-23'
  description: This talk shares lessons learned going from NLP researcher to building
    Noetica, a platform that analyzes populations of complex contracts to determine
    market standards for deal terms. Along the way I'll discuss (1) how LLMs have
    enabled a new opportunity space for hybrid systems that combine extraction capabilities
    with formal analytical frameworks, (2) how building these systems still requires
    deep fusion of subject-matter and technical judgment to identify tractable decompositions
    of seemingly impossible problems, and (3) how this converges to a new version
    of the Technical Product Manager role. This role is highly suited to technical
    researchers willing to tackle sector-specific challenges.
