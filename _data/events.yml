- bio: Asaf Bord has 20+ years of experience in data and AI, working across startups
    and enterprise companies like eBay, WeWork, and Northwestern Mutual. At Northwestern
    Mutual, he leads the company's Data and GenAI efforts—from corporate strategy
    to hands-on project delivery from POC to production. Asaf also co-founded Multinear,
