  date: '2026-01-27'
  description: Most enterprises still run mission-critical workloads on legacy systems—Informatica,
    Sybase, COBOL, stored procedures, ETL pipelines written decades ago. Modernizing
    them requires thousands of hours just to understand what the code does. This talk
    presents a practical, deployed approach for building AI agents that analyze, map,
    and explain legacy codebases with high reliability. Based on real production work
    at a Fortune 100, we cover the architecture, evaluation patterns, safety guardrails,
    and workflow design that make these agents viable. We also show how deploying
    them through GitHub Copilot (GHCP) became both a technical accelerator and an
    organizational adoption driver. Attendees will leave with a clear blueprint for
    how to make agentic automation safe, predictable, and impactful in real modernization
    programs.
  tag: Seminar
