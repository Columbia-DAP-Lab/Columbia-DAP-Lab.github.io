- bio: Jacopo Tagliabue is the co-founder of Bauplan, a data and AI infrastructure
    company. Previously, he co-founded Tooso (acquired by TSX:CVO), led Coveo's AI
    through its IPO, and built Coveo Labs, whose libraries, models, and datasets have
    garnered thousands of stars and millions of downloads. His research spans AI,
    NLP, information retrieval, data management, and computer systems, with collaborations
