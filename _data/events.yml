- bio: "Mehdi is the cofounder and CEO of Veris AI, an agentic infrastructure company
    based in NY, building simulation training grounds for enterprise AI agents. Veris
    is named on the Future50 list by the Generalist and is backed by Decibel Ventures
    and ACrew Capital.    \nMehdi is an applied AI researcher, builder, and industry
    leader. He holds a PhD in Electrical Engineering and Computer Science and an M.S.
    in Physics, both from UC Berkeley. Most recently, he served as the Director of
    AI at System.com"
  date: '2025-09-16'
  description: AI agents hold great value for enterprises but are notoriously difficult
    to productionize in a robust and reliable way. Enterprise agents must internalize
    task context, constraints, and success metrics to be reliable, yet learning directly
    in production is risky and often infeasible. Veris is a simulation-first experiential
    learning platform for training and evaluating domain-specific AI agents through
    simulated experience. I will present how Veris constructs high-fidelity interactive
    environments that mirror target deployments, including tool APIs, data schemas,
    user behaviors, and organizational policies. Then I will discuss how Veris supports
    multiple post-training paths like RL with online rollouts and trajectory replay,
    and iterative prompt or policy optimization. Finally, I will outline current challenges
    and research opportunities.
  tag: Seminar
  time: 12PM
  title: Simulation Environments for testing and training task-focused AI agents
  where: CSB 453
