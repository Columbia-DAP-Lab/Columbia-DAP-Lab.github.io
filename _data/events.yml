- bio: |-
    Thomas Bueler-Faudree is the co-founder of August, where he leads engineering and product.
    He earned a bachelor's degree in computer science and history from Columbia University.
    At Columbia he worked in the CRIS Lab and CML.
  date: '2025-10-21'
  description: |-
    Modern document-heavy work in law, finance, and consulting is repetitive, bespoke, and review
    heavy. Code generation tools like Cursor have reshaped how developers work, but that shift has
    not happened in law. Legal tasks are hard to measure and even harder to "unit test," which is
    why many AI tools miss the mark.

    This talk shows how August is building agents that do better: the right indexing methods,
    visible state, disciplined tool use, and citations at every step to cleanly automate real
    professional workflows. We'll walk through a multi-step research agent (e.g., over SEC filings)
    that plans the task, retrieves the right sources, routes to the relevant sections, and drafts
    grounded legal answers.

    Attendees will leave with a lightweight design pattern for credence domains like law. We will
    also share our growth and go-to-market. We are productizing law-firm workflows and, in some
    cases, selling with the firm to their clients. This is a new model that is gaining traction
    across professional services.
  role: Co-founder
