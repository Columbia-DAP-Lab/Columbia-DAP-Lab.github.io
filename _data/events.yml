  description: "Chi will present MassGen, a growing open-source multi-agent scaling
    system that tackles single-agent limitations through collaborative AI coordination.
    Built on AG2's research foundation, the system implements novel coordination of
    frontier AI agents. Early benchmarking across reasoning and instruction-following
    tasks shows statistically significant improvements, with growing industrial and
    academic adoption demonstrating the research opportunity for scaling intelligence
    through collaborative emergence.  \nChi Wang is founder of AutoGen (now AG2),
    the open-source AgentOS to support agentic AI, and its parent open-source project
    FLAML, a fast library for AutoML & tuning. He has received multiple awards such
    as best paper of ICLR'24 LLM Agents Workshop and SIGKDD Data Science/Data Mining
    PhD Dissertation Award. He has 15+ years of research experience in Computer Science
    from Google DeepMind, Microsoft Research, Meta, UIUC and Tsinghua."
