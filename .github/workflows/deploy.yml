
name: Deploy GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"  # Every day at 10 AM New York time
  push:
    branches: ["main"]  # Trigger on non-action pushes to main branch
  repository_dispatch:
    types: [content-updated]  # Sent by Convex when content is published

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest  # Use a GitHub-hosted runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.5'  # Specify the required Ruby version
          bundler-cache: true  # Cache dependencies

      - name: Install dependencies
        run: bundle install

      # Images stored in Convex are downloaded during the build and published with
      # the site. A stored file never changes under its id, so keep them between
      # builds and download only new ones.
      - name: Cache images from Convex
        uses: actions/cache@v4
        with:
          path: .convex-media
          key: convex-media-${{ github.run_id }}
          restore-keys: convex-media-

      # Events, publications, people, news and projects live only in Convex; the
      # build loads them itself (_plugins/convex_content.rb) from `convex.site_url`
      # in _config.yml. If Convex cannot be reached the build fails, and Pages keeps
      # the last deploy.
      - name: Build site
        run: bundle exec jekyll build  # Modify if using a different static site generator

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3  # Upload generated site for deployment

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy site
        uses: actions/deploy-pages@v4

