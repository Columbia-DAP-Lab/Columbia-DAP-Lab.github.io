name: Back up Convex content

# Convex is the only source of the site's content; the repo holds no copy the site
# reads. This commits the public content feed (content.json) to _backup/ every
# night, which does two things:
#
#   - keeps a readable history of content changes: `git log -p _backup/` answers
#     what changed and when, which moving out of the repo otherwise costs
#   - keeps an off-Convex copy of everything the site publishes
#
# Jekyll ignores directories that start with an underscore, so the site never reads
# or publishes this file. It holds only what the site already shows; users, drafts
# and uploaded files are not in it. For a full copy of the deployment, use
# `npx convex export --prod --include-file-storage`.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # 3 AM New York time

permissions:
  contents: write

concurrency:
  group: backup-convex
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch content.json from Convex
        # Pretty-printed and without the timestamp, so a night with no content
        # changes makes no commit and the diff shows only what changed.
        run: |
          site_url=$(sed -n 's/^  site_url: *"\(.*\)".*/\1/p' _config.yml)
          test -n "$site_url" || { echo "::error::no convex.site_url in _config.yml"; exit 1; }
          mkdir -p _backup
          curl --fail --silent --show-error --retry 3 "$site_url/content.json" \
            | jq --indent 2 'del(.generatedAt)' > _backup/content.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _backup/content.json
          git diff --cached --quiet || git commit -m "Back up Convex content"
          git push
