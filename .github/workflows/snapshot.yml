name: Snapshot Convex content to _data

# Convex is the source of truth for events, publications, people and news. This
# commits a copy back every night, which does three things:
#
#   - gives the build a fallback when Convex is unreachable (see deploy.yml)
#   - restores a readable history of content changes, which moving out of the repo
#     otherwise costs: `git log -p _data/` still answers what changed and when
#   - is the disaster-recovery copy if the deployment is ever lost
#
# The committed files are generated. Edit content at /admin, not here.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # 3 AM New York time

permissions:
  contents: write

concurrency:
  group: snapshot-convex
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.5"

      - name: Fetch content from Convex
        env:
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          # A snapshot that silently kept yesterday's copy would be worthless, so
          # unlike the build, this fails loudly when Convex cannot be reached.
          CONVEX_FETCH_STRICT: "1"
        run: ruby scripts/fetch_content.rb

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/events.yml _data/pubs.yml _data/people.yml _data/news.yml
          git diff --cached --quiet || git commit -m "Snapshot Convex content to _data"
          git push
