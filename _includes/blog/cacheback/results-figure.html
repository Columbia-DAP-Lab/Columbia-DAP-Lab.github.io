<figure class="results-figure wide"><div class="figure-kicker"><span>Accuracy and completion time</span><span>Higher is more accurate · Farther left is faster</span></div><div class="results-controls"><div aria-label="Benchmark" class="tab-group" role="group"><button aria-pressed="true" class="selected-control" data-benchmark="fanoutqa">FanOutQA</button><button aria-pressed="false" data-benchmark="longbench">LongBench v2 Easy</button></div></div><ul aria-label="Plot legend" class="plot-legend"><li><svg aria-hidden="true" viewbox="0 0 28 12"><path d="M2 6h24" stroke="#0f766e" stroke-width="2"></path><circle cx="14" cy="6" fill="#0f766e" r="3.2"></circle></svg>CacheBack <span>(labels: compression)</span></li><li><svg aria-hidden="true" viewbox="0 0 28 12"><path d="M2 6h24" stroke="#995319" stroke-dasharray="4 3" stroke-width="2"></path><path d="M14 2.5l3.5 6h-7z" fill="#995319"></path></svg>Text <span>(labels: sender size)</span></li><li><svg aria-hidden="true" viewbox="0 0 28 12"><circle cx="14" cy="6" fill="#0f766e" opacity=".42" r="3.2"></circle></svg>Dominated setting</li><li><svg aria-hidden="true" viewbox="0 0 28 12"><path d="M11 3l6 6M11 9l6-6" stroke="#666c65" stroke-width="1.4"></path></svg>Receiver gets only the question</li></ul><div class="results-grid"><div class="result-panel"><button aria-label="Expand Qwen3-8B result plot" class="plot-expand" data-expand-model="qwen"><img alt="FanOutQA Qwen3-8B accuracy and median latency curves for CacheBack and text communication." class="result-plot" height="460" id="result-plot-qwen" src="/files/images/blog/cacheback/fanoutqa-qwen.svg" width="560"/><span aria-hidden="true" class="expand-label">Enlarge ↗</span></button><p class="panel-insight" data-edit-id="text-72" id="result-insight-qwen">At 4× compression, Qwen3-8B is more accurate and 3.2× faster than text senders using the same model. </p></div><div class="result-panel"><button aria-label="Expand Nemotron Nano 2 12B result plot" class="plot-expand" data-expand-model="nemotron"><img alt="FanOutQA Nemotron Nano 2 12B accuracy and median latency curves for CacheBack and text communication." class="result-plot" height="460" id="result-plot-nemotron" src="/files/images/blog/cacheback/fanoutqa-nemotron.svg" width="560"/><span aria-hidden="true" class="expand-label">Enlarge ↗</span></button><p class="panel-insight" data-edit-id="text-73" id="result-insight-nemotron">At 8× compression, Nemotron is more accurate and 1.3× faster than text senders using the same model. </p></div></div><p class="mobile-figure-hint" data-edit-id="text-74">Tap either plot to enlarge</p><figcaption data-edit-id="text-75"><span class="figure-number">Figure 6.</span> Accuracy and task-completion latency · 50 concurrent tasks · eight H100 GPUs.<details style="margin-top:8px"><summary style="cursor:pointer">Experimental setup</summary><p style="margin:8px 0 0">Each benchmark submits 50 tasks at once to eight H100 GPUs. Task-completion latency includes queueing and sender and receiver computation. Accuracy averages three generated answers per task. Text uses one GPU pool; most CacheBack configurations assign separate pools to senders and receivers. Faded points have a faster or more accurate setting of the same method that does no worse on the other measure. LongBench reports answer accuracy on the Easy subset.</p></details></figcaption></figure>
