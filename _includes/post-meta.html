<header class="post-header">
  {%- if page.title %}
  <h1 class="post-title">{{ page.title }}</h1>
  {%- endif %}
  <p class="post-byline">
    {%- if page.authors -%}
      {%- for a in page.authors -%}
        {%- if a.url %}<a href="{{ a.url }}">{{ a.name }}</a>{% else %}{{ a.name }}{% endif -%}
        {%- unless forloop.last %}, {% endunless -%}
      {%- endfor %}
      <span aria-hidden="true">·</span>
    {% endif -%}
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </p>
</header>

<style>
.post-header { margin-bottom: 2rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--dap-rule); }
.post-title { font-size: 1.75rem; margin: 0 0 0.6rem; }
.post-byline { color: var(--dap-muted); font-size: 0.95rem; margin: 0; }
.post-byline a { color: var(--dap-muted); text-decoration: underline; text-decoration-color: var(--dap-rule); }
.post-byline a:hover { color: var(--dap-navy); }
@media (max-width: 575.98px) { .post-title { font-size: 1.5rem; } }
</style>
