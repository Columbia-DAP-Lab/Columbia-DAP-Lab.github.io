# Local development against the dev Convex deployment, layered over _config.yml:
#
#   bundle exec jekyll serve --config _config.yml,_config.dev.yml --host localhost
#
# The admin page then talks to dev, a sandbox, instead of production, and the
# build loads its content from dev too (_plugins/convex_content.rb).
convex:
  url: "https://agreeable-stork-479.convex.cloud"
  site_url: "https://agreeable-stork-479.convex.site"
