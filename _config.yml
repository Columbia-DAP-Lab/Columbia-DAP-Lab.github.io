title: "DAPLab"
tagline: "Infrastructure for Trustworthy Agent Automation | Columbia University"
description: "DAPLab at Columbia University develops full-stack infrastructure for trustworthy AI agent automation in real-world environments. We vertically integrate expertise across operating systems, data systems, AI, HCI, security, and enterprise workflows to build end-to-end agentic systems with real guarantees around reliability, observability, safety, and control."
author: "DAPLab, Columbia University"
keywords: "DAPLab, Columbia University, trustworthy AI agents, agent automation, agentic systems, systems research, HCI, data systems, safety, reliability, observability, large language models, vertical integration"
og_image: "/daplab_logo.png"
baseurl: "" # Keep this blank for GitHub Pages root
url: "https://daplab.cs.columbia.edu" # Full site URL without trailing slash
timezone: "America/New_York"
theme: minima # Default theme, or replace with your theme
plugins:
  - jekyll-sitemap
collections:
  projects:
    output: true
    permalink: /projects/:name/
  benchmarks:
    output: true
    permalink: /benchmarks/:name/
include:
  - _projects  # Include images from _projects in the build
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "benchmarks"
    values:
      layout: "benchmark"
ug_ms_application_url: "https://forms.gle/6FkeeJv43arrbN1n9"

# The admin UI at /admin/ talks to Convex straight from the browser. Both values are
# public by design — the client id is not a secret, and every call is authorized
# server-side. Keep them in step with the deployment the build fetches from:
#   convex_url       same deployment as the CONVEX_SITE_URL repository variable,
#                    but .convex.cloud rather than .convex.site
#   google_client_id the deployment's GOOGLE_CLIENT_ID (npx convex env get)
admin:
  convex_url: "https://agreeable-stork-479.convex.cloud"
  google_client_id: "851564657364-j2jgceoiq06g67pbtci3p55cod07s869.apps.googleusercontent.com"
